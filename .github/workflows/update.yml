# 毎月1日・15日（日本時間 朝6時）に休館日ICSを再生成してコミットする
name: update-ics
on:
  schedule:
    - cron: "0 21 1,15 * *"   # UTC 21:00 = JST 06:00
  workflow_dispatch:           # 手動実行も可（Actions タブの Run workflow）
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 gen_ics.py
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/gg_kyukan.ics
          git diff --cached --quiet || git commit -m "update ics $(date -u +%F)"
          git push
